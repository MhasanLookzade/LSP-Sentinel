[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsp-sentinel"
version = "1.0.0"
description = "Autonomous LSP-Sentinel SRE Health, Resilience & Disk Intelligence Suite"
authors = [{ name = "DevOps Engineering Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.8",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "rich>=13.7.1",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.4",
    "requests>=2.31.0",
    "jinja2>=3.1.3",
]

[project.scripts]
lsp-sentinel = "sentinel.cli:app"
lsp-sential = "sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
